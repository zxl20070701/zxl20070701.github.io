<header>
    如何训练？
</header>
<h2>
    训练判别器
</h2>
<p>
    固定生成器，喂入真实样本和生成的假样本，更新判别器参数，提升鉴别能力：
</p>
<img src="./images/neural-network/gan/3.png" width="500px">
<p>
    就是希望输入假样本的时候，判别器输出值越靠近0越好，输入真实样本的时候，判别器输出值越靠近1越好。
</p>
<h2>
    训练生成器
</h2>
<p>
固定判别器，用随机噪声让生成器生成样本，目标是让判别器判定为"真"，更新生成器参数。
</p>
<img src="./images/neural-network/gan/4.png" width="500px">
