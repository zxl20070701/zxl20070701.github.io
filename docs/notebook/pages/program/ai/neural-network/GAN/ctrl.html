<header>
    如何控制生成的内容？
</header>
<p>
    比如0～9的数字生成，普通的GAN只能随机生成0～9之间的任意一个数，你没办法指定让它生成具体哪个数字。
</p>
<p>
    所以我们需要对标准GAN进行扩展，也就有了cGAN（条件生成对抗网络），其主要思想就是在原来的GAN基础上引入额外的信息条件。
</p>
<img src="./images/neural-network/gan/5.png" width="500px">
<p>
    简单的说就是：
</p>
<ol>
    <li>
        生成器的输入由 “随机噪音” 变成了 “随机噪音 + 条件标签”
    </li>
    <li>
        判别器的输入由 “伪造图片/真实图片” 变成了 “伪造图片/真实图片 + 对应标签”
    </li>
</ol>
