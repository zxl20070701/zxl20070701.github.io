<header>
    安装
</header>
<h2>
    Mac OS 上安装 PostgreSQL
</h2>
<p>
    打开<a href="https://www.enterprisedb.com/downloads/postgres-postgresql-downloads" target="_blank">https://www.enterprisedb.com/downloads/postgres-postgresql-downloads</a>下载页面，
    在<span class="warn">Mac OS X</span>选择一个版本下载即可。
</p>
<p>
    下载后（比如：<span class="warn">postgresql-18.4-1-osx.dmg</span>），正常安装，可能会有一些基本的配置，一般使用默认的就好。
</p>
<p>
    执行以下脚本启动 PostgreSQL：
</p>
<pre>
/Library/PostgreSQL/18/scripts/runpsql.sh;exit
</pre>
